name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[fits,dev,explain]"
      - name: Verify explanation layer
        run: |
          python explanation/tools/build_notebooks.py --check
          python explanation/tools/validate_explanation.py
      - name: Re-execute explanation notebooks
        if: matrix.python-version == '3.11'
        run: python explanation/tools/build_notebooks.py --execute-check
      - name: Test
        run: pytest
